<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бартер">
<title>Бартер bladnes</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--panel3:#232c37;--line:#2a323d;--line2:#343e4b;
--tx:#e6edf3;--tx2:#9aa7b4;--tx3:#6e7b88;--acc:#4f9cf9;--acc2:#f2a65a;--ok:#3fb950;--warn:#d29922;--bad:#f85149;
--s1:#3987e5;--s2:#d95926;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
body{overflow-x:hidden}
body.lock{overflow:hidden}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit}
b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- каркас ---------- */
.side{display:none}
.main{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;
  color:var(--tx);font-size:13px;cursor:pointer;min-height:36px}
.ava{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#0e1116;flex:none}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);display:grid;place-items:center;cursor:pointer}
.ib:hover{color:var(--tx);border-color:var(--line2)}
.view{padding:14px 16px 24px;max-width:1180px;margin:0 auto}
.draft{font-size:12px;color:var(--tx2);background:#1a2129;border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.5}
.draft b{color:var(--tx)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,27,34,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:11px;padding:6px 0;border-radius:10px;min-height:52px;justify-content:center;position:relative}
.tabs a.on{color:var(--tx)}
.tabs a.on svg{stroke:var(--acc)}
.tabs .bd{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;border:none;
  background:var(--acc);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px;stroke-width:2.4}

@media(min-width:900px){
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;gap:4px;z-index:25}
  .side .logo{font-weight:800;font-size:17px;padding:4px 10px 16px;letter-spacing:-.01em}
  .side .logo span{display:block;font-size:11px;font-weight:500;color:var(--tx2);letter-spacing:.02em;margin-top:2px}
  .side a{display:flex;align-items:center;gap:10px;color:var(--tx2);padding:10px 10px;border-radius:10px;font-size:14px;position:relative}
  .side a:hover{background:var(--panel2);color:var(--tx)}
  .side a.on{background:var(--panel3);color:var(--tx)}
  .side a.on svg{stroke:var(--acc)}
  .side .bd{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
  .side .sep{height:1px;background:var(--line);margin:10px 6px}
  .side .add{margin-top:6px;background:var(--acc);color:#fff;justify-content:center;font-weight:600}
  .side .add:hover{background:#3d8ae8;color:#fff}
  .side .foot{margin-top:auto;font-size:11px;color:var(--tx3);padding:8px 10px;line-height:1.5}
  .main{margin-left:232px;padding-bottom:40px}
  .tabs,.fab{display:none}
  .view{padding:18px 26px 40px}
}

/* ---------- элементы ---------- */
.sec{margin:20px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:13px;margin:0;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sec .r{margin-left:auto;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:10px}
@media(min-width:900px){.list.g2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.cols>div{min-width:0}
@media(min-width:1100px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--tx);font-size:15px;font-weight:500;cursor:pointer;text-align:center;line-height:1.2}
.btn:hover{border-color:#4a5667}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover{background:#3d8ae8}
.btn.pri:disabled{background:#26374d;border-color:#26374d;color:#7d8fa6;cursor:not-allowed}
.btn.ok{background:#12331d;border-color:#1d5c31;color:#56d364}
.btn.danger{color:#ff7b72;border-color:#5a2a2a;background:#2a1717}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.w{width:100%}
.btn.link{background:none;border:none;color:var(--acc);padding:0 4px;min-height:32px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--tx2);font-size:14px;cursor:pointer;white-space:nowrap;user-select:none}
.chip .n{color:var(--tx3);font-size:12.5px}
.chip.on{background:#1c3350;border-color:var(--acc);color:var(--tx)}
.chip.on .n{color:#9cc5fb}

.stc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.stc::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-agreed{background:#262d36;color:#b1bac4}
.st-transit{background:#132a45;color:#79b8ff}
.st-delivered{background:#0f3036;color:#56d4dd}
.st-posted{background:#12331d;color:#56d364}
.st-overdue{background:#3d1616;color:#ff7b72}
.st-refused{background:#22272e;color:#768390}
.gr{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:6px;font-size:12px;font-weight:700;padding:0 6px}
.gr-A{background:#12331d;color:#56d364}.gr-B{background:#132a45;color:#79b8ff}.gr-C{background:#3d1616;color:#ff7b72}.gr-w{background:#262d36;color:#b1bac4}
.pl{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:10px;font-weight:800;flex:none;letter-spacing:-.02em}
.pl-TikTok{background:#111;color:#fff;border:1px solid #3a3a3a}
.pl-Instagram{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);color:#fff}
.pl-YouTube{background:#c4302b;color:#fff}.pl-VK{background:#0077ff;color:#fff}.pl-Telegram{background:#229ed9;color:#fff}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--panel3);color:var(--tx2);white-space:nowrap}
.tag.ex{background:#3a2a10;color:#f2c46d}

/* карточки отправок и блогеров */
.it{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:block;color:inherit}
.it:hover{border-color:var(--line2)}
.it .l1{display:flex;align-items:center;gap:8px;min-width:0}
.it .l1 .nm{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .l1 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.it .l2{display:flex;align-items:center;gap:10px;margin-top:9px}
.it .l3{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.it .l3 b{color:var(--tx);font-weight:600}
.it .dl{font-size:12.5px;margin-top:8px;color:var(--tx2)}
.thumbs{display:flex;gap:6px}
.th{width:44px;height:44px;border-radius:9px;background:#fff center/cover no-repeat;border:1px solid var(--line);flex:none}
.th.sm{width:34px;height:34px;border-radius:7px}
.th.none{background:var(--panel3);display:grid;place-items:center;color:var(--tx3);font-size:11px}
.bava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--panel3);color:var(--tx);flex:none;font-size:15px}

/* задачи */
.tk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:12px}
.tk .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.tk .ic svg{width:18px;height:18px}
.tk.red .ic{background:#3d1616;color:#ff7b72}
.tk.amb .ic{background:#3a2a10;color:#f2c46d}
.tk.blu .ic{background:#132a45;color:#79b8ff}
.tk.grn .ic{background:#12331d;color:#56d364}
.tk .bd{flex:1;min-width:0}
.tk .tt{font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.tk .tx{font-size:13.5px;color:var(--tx2);margin-top:3px;line-height:1.45}
.tk .tx b{color:var(--tx)}
.tk .row{margin-top:10px}
.sub{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
.sub .li{display:flex;align-items:center;gap:8px 10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sub .li .row{margin:0!important;flex-wrap:wrap}
.sub .li:last-child{border-bottom:none}
.sub .li .g{flex:1 1 180px;min-width:0;font-size:14px;overflow-wrap:anywhere}
.sub .li .g .s{font-size:12.5px;color:var(--tx2)}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cnt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;cursor:pointer}
.cnt .v{font-size:22px;font-weight:700;line-height:1.1}
.cnt .l{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.25}

/* журнал */
.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.lg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.lg:last-child{border-bottom:none}
.lg .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--panel3);color:var(--tx2)}
.lg .ic svg{width:16px;height:16px}
.lg .ic.m{background:#3a2a10;color:#f2a65a}.lg .ic.s{background:#132a45;color:#79b8ff}.lg .ic.o{background:#12331d;color:#56d364}.lg .ic.a{background:#2b1f45;color:#b392f0}
.lg .t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.lg .t .w{font-size:12px;color:var(--tx3);margin-top:2px}
.lg .t b{font-weight:600}
.lg .undo{font-size:12.5px}
.lg.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#1c3350}100%{background:transparent}}
.day{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;padding:12px 0 4px}

/* поиск */
.search{position:relative}
.search input.in{padding-left:42px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);width:18px;height:18px}

/* формы */
.fld{margin-bottom:16px}
.fld>label,.lab{display:block;font-size:13px;color:var(--tx2);margin-bottom:7px;font-weight:500}
.fld .hint{font-size:12.5px;color:var(--tx3);margin-top:6px;line-height:1.45}
input.in,textarea.in,select.in{width:100%;min-height:48px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--tx);
  font-size:16px;padding:10px 14px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
textarea.in{min-height:120px;resize:vertical;line-height:1.5;font-size:14.5px}
input.in:focus,textarea.in:focus{border-color:var(--acc)}
.inb{display:flex;gap:8px}.inb .in{flex:1;min-width:0}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.box.warn{background:#2a2110;border-color:#5c4514}
.box.bad{background:#2a1515;border-color:#5a2a2a}
.box.ok{background:#10261a;border-color:#1d5c31}
.box.info{background:#12233a;border-color:#1f3f66}
.box .t{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.box .d{font-size:13.5px;color:var(--tx2);margin-top:4px;line-height:1.45}
.box .row{margin-top:10px}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;cursor:pointer;margin-top:8px}
.res:hover,.res:focus{border-color:var(--acc);outline:none}
.res .g{flex:1;min-width:0}
.res .g .a{font-weight:600}.res .g .b{font-size:12.5px;color:var(--tx2)}
.sel{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#132a45;border:1px solid #1f4f86}
.sel .g{flex:1;min-width:0}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:330px;overflow:auto;margin-top:10px;padding:2px}
@media(min-width:600px){.prods{grid-template-columns:repeat(4,1fr)}}
.pc{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px;cursor:pointer;text-align:left;color:var(--tx)}
.pc:hover{border-color:var(--acc)}
.pc .ph{aspect-ratio:1;border-radius:8px;background:#fff center/cover no-repeat}
.pc .n{font-size:11.5px;line-height:1.25;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
.pc .p{font-size:11px;color:var(--tx3);margin-top:2px}
.pi{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-top:8px}
.pi .g{flex:1;min-width:0}
.pi .n{font-size:14px;font-weight:500;line-height:1.3}
.pi .c{font-size:12.5px;color:var(--tx2);margin-top:2px}
.pi .chips{margin-top:8px}
.pi .chip{min-height:34px;padding:0 12px;font-size:13.5px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.step button{width:36px;height:34px;background:var(--panel3);border:none;color:var(--tx);font-size:18px;cursor:pointer}
.step span{min-width:30px;text-align:center;font-weight:600}
.x{background:none;border:none;color:var(--tx3);cursor:pointer;padding:4px;align-self:flex-start}
.x:hover{color:var(--tx)}
.toggle{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer}
.toggle .g{flex:1}
.sw2{width:44px;height:26px;border-radius:999px;background:#3a4452;position:relative;flex:none;transition:.15s}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .sw2{background:var(--ok)}.toggle.on .sw2::after{left:21px}
.copy{display:flex;gap:8px;align-items:stretch}
.copy .v{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all;color:var(--tx2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.55}

/* шторки */
.sw{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,12,.66);animation:fade .15s ease-out}
.shx{background:var(--panel);width:100%;max-width:620px;max-height:93vh;max-height:93dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .22s cubic-bezier(.2,.8,.3,1);border:1px solid var(--line);border-bottom:none;box-shadow:0 -12px 40px rgba(0,0,0,.4)}
.shx.wide{max-width:860px}
.shx .grab{width:40px;height:5px;border-radius:9px;background:#3a4452;margin:8px auto 0}
.sh-h{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.sh-h .g{flex:1;min-width:0}
.sh-h h3{margin:0;font-size:18px;line-height:1.3}
.sh-h .s{font-size:13px;color:var(--tx2);margin-top:3px}
.sh-b{padding:16px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.sh-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sh-f .btn{flex:1;min-height:50px}
@media(min-width:900px){.sw{align-items:center;padding:24px}.shx{border-radius:18px;border-bottom:1px solid var(--line);max-height:88vh}.shx .grab{display:none}.sh-h{padding-top:16px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.menu .mi{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.menu .mi:hover{background:var(--panel2);border-color:var(--line)}
.menu .mi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--panel3);flex:none}
.menu .mi .ic.p{background:var(--acc);color:#fff}
.menu .mi .a{font-weight:600;font-size:16px}.menu .mi .b{font-size:13px;color:var(--tx2);margin-top:1px}

/* детали */
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv>div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.kv .l{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:16px;font-weight:700;margin-top:2px;white-space:nowrap}
.kv .v.sm{font-size:14px}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
.tl .st{text-align:center;font-size:11.5px;color:var(--tx3);position:relative;padding-top:18px}
.tl .st::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#3a4452;z-index:1}
.tl .st::after{content:'';position:absolute;top:8px;left:-50%;width:100%;height:2px;background:#3a4452}
.tl .st:first-child::after{display:none}

// JSONP без куки Google: при двух аккаунтах в браузере запрос с куки уходит на /macros/u/1/… и падает с 503
function jsonp(params, ms){
  return new Promise((ok, bad) => {
    const cb = 'bt_' + rid(), s = document.createElement('script');
    s.crossOrigin = 'anonymous';
    const done = () => { clearTimeout(tm); try { delete window[cb]; } catch(e) { window[cb] = undefined; } s.remove(); };
    const tm = setTimeout(() => { done(); bad(new Error('timeout')); }, ms || 45000);
    window[cb] = r => { done(); ok(r); };
    s.onerror = () => { done(); bad(new Error('network')); };
    const q = Object.entries(Object.assign({}, params, {callback:cb, _:Date.now()})).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
    s.src = API + '?' + q; document.head.appendChild(s);
  });
}
// Google иногда отвечает 503 или думает полминуты — три попытки с паузой
async function api(params, tries){
  tries = tries || 3; let last;
  for (let i = 0; i < tries; i++){
    try { return await jsonp(params); } catch(e) { last = e; await new Promise(r => setTimeout(r, 1500 * (i + 1))); }
  }
  throw last;
}
function fromServer(d){
  const items = {};
  (d.it || []).forEach(i => (items[i.s] = items[i.s] || []).push(i));
  return {
    bl: d.bl.map(b => Object.assign({}, b, {raw: b.note || '', fol: b.fol || 0})),
    sh: d.sh.map(s => Object.assign({}, s, {items: items[s.id] || [], promised: s.promised || [], ship: s.ship || 0, cogs: s.cogs || 0, extra: s.extra || 0})),
    po: d.po, ms: d.ms, found: d.found || [], log: d.log || [], cfg: d.cfg || {},
    links: Object.fromEntries((d.links || []).map(l => [l.code, {b: l.b || null, st: l.st === 'no' ? 'no' : 'ok', how: l.how}])),
    done: Object.fromEntries((d.done || []).map(x => [x, 1]))
  };
}

// Действие: запись в очередь, отправка по одному; повтор с тем же opId безопасен — скрипт помнит его 6 часов
function enqueue(op){ op.opId = op.opId || rid(); QUEUE.push(op); saveQueue(); flush(); return op.opId; }
let FLUSHING = false;
async function flush(){
  if (FLUSHING || !QUEUE.length) return;
  FLUSHING = true; SYNC.busy++; renderSync();
  let changed = false;
  try {
    while (QUEUE.length){
      const op = QUEUE[0];
      let r;
      try { r = await api({action:'op', key:PIN, op:JSON.stringify(op)}); }
      catch(e) { SYNC.off = true; setTimeout(flush, 20000); break; }             // нет связи — попробуем позже
      SYNC.off = false; QUEUE.shift(); saveQueue(); changed = true;
      if (!r.ok) toast('Не сохранилось: ' + esc(r.error || 'ошибка'));
      if (op._resolve) op._resolve(r);
    }
  } finally { FLUSHING = false; SYNC.busy--; renderSync(); }
  if (changed && !QUEUE.length) await loadAll();
}
// дождаться ответа скрипта (нужно, когда скрипт выдаёт номер: блогер, отправка, публикация)
function sendWait(op){
  return new Promise(res => {
    op.opId = rid(); op._resolve = res;
    QUEUE.push(op); saveQueue(); flush();
  });
}
// обычное действие: сразу показываем на экране, в базу уходит в фоне
function send(op, local){ if (local) try { local(); } catch(e) {} if (S) refresh(); enqueue(op); }
function renderSync(){

  el.title = el.querySelector('span').textContent;
}

const validSent = s => !!(s.sent && s.sent >= '2026-01-01');
function derive(){
  const m = {};

  m.s = Object.fromEntries(S.sh.map(s => [s.id, s]));
  m.p = Object.fromEntries(S.po.map(p => [p.id, p]));
  const shipsOf = {}, postsOf = {}, msOf = {};
  S.sh.forEach(s => (shipsOf[s.b] = shipsOf[s.b] || []).push(s));
  S.po.forEach(p => (postsOf[p.s] = postsOf[p.s] || []).push(p));
  S.ms.forEach(x => (msOf[x.p] = msOf[x.p] || []).push(x));
  m.shipsOf = shipsOf;
  S.po.forEach(p => {
    const arr = (msOf[p.id] || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
    p._ms = arr; p._views = arr.length ? +arr[arr.length-1].v || 0 : 0; p._measured = arr.length > 0;
    p._age = p.d ? diffDays(p.d, TODAY) : null;
  });
  const cfg = S.cfg;
  S.sh.forEach(s => {
    const b = m.b[s.b];
    s._sentOk = validSent(s);
    s._sent = s._sentOk ? s.sent : (s.deal || (b && b.first) || null);   // фолбэк, пока дата не исправлена
    s._posts = (postsOf[s.id] || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
    s._cost = s.refused ? 0 : (s.cogs || 0) + (s.ship || 0) + (s.extra || 0);
    s._views = sum(s._posts, p => p._views);
    s._shipWait = s.svc === 'СДЭК' && !s.ship && !s.refused;   // стоимость придёт из API СДЭК
    const base = s.dlv || (s._sentOk ? addDays(s.sent, cfg.transit) : null);
    s._deadline = base ? addDays(base, cfg.pubDays) : null;
    s._firstPost = s._posts.length ? s._posts[0].d : null;
    s._days = s._firstPost && s._sent ? diffDays(s._sent, s._firstPost) : null;
    if (s.refused) s._st = 'refused';
    else if (s._posts.length) s._st = 'posted';
    else if (!s._sentOk && !s.dlv) s._st = 'agreed';
    else if (s._deadline && TODAY > s._deadline) s._st = 'overdue';
    else if (s.dlv) s._st = 'delivered';
    else s._st = 'transit';
    s._orders = []; s._rev = 0; s._margin = 0;
  });
  // дата под вопросом: опечатка в годе или отправка раньше договорённости/первого контакта (пока не подтверждена)
  const doubt = s => { if (!s._sentOk) return true; if (S.done['bf-' + s.id]) return false;
    const b = m.b[s.b], ref = [s.deal, b && b.first].filter(Boolean).sort().pop(); return !!(ref && s.sent < ref); };
  const sentAll = S.sh.filter(s => !s.refused && s.b && s._sentOk).sort((a, b) => a.sent < b.sent ? -1 : 1);
  m.fotFirst = sentAll.find(s => !doubt(s)) || null;
  m.fotEarlier = m.fotFirst ? sentAll.filter(s => doubt(s) && s.sent.slice(0,7) < m.fotFirst.sent.slice(0,7)) : [];
  m.fotFrom = m.fotFirst ? m.fotFirst.sent.slice(0,7) : null;
  Object.values(shipsOf).forEach(arr => arr.filter(s => !s.refused).sort((a, b) => (a._sent || a.deal || '9') < (b._sent || b.deal || '9') ? -1 : 1)
    .forEach((s, i) => s._iter = i + 1));
  // промокоды → блогер: таблица, решения Степана/Матвея, совпадение с ником
  const L = {};
  S.bl.forEach(b => { if (b.promo) L[b.promo] = {b:b.id, st:'ok', how:'в карточке блогера'}; });
  const codes = [...new Set(ORDERS.map(o => o.promo))];
  codes.forEach(c => {
    if (S.links[c]) { L[c] = S.links[c]; return; }
    if (L[c]) return;
    const lc = c.toLowerCase();
    const ex = S.bl.find(b => core(b.h) === lc);
    if (ex) { L[c] = {b:ex.id, st:'auto', how:'совпадает с ником'}; return; }
    const pt = lc.length >= 3 && S.bl.find(b => core(b.h).includes(lc));
    if (pt) { L[c] = {b:pt.id, st:'pending', how:'похож на ник'}; return; }
    L[c] = {b:null, st:'none'};
  });
  m.links = L;
  const use = l => l && l.b && (l.st === 'ok' || l.st === 'auto' || (l.st === 'pending' && cfg.usePending));
  m.orders = ORDERS.map(o => {
    const r = Object.assign({}, o, {d:o.dt.slice(0,10), rev:o.goods - o.disc});
    r.margin = r.rev - o.cogs - o.paid * ACQ;
    const l = L[o.promo]; r._b = use(l) ? l.b : null; r._pending = l && l.st === 'pending';
    if (r._b){
      let pick = null;
      (shipsOf[r._b] || []).filter(s => !s.refused && s._sent).sort((a, b) => a._sent < b._sent ? -1 : 1)
        .forEach(s => { if (s._sent <= r.d) pick = s; });
      if (pick){ r._s = pick.id; pick._orders.push(r); pick._rev += r.rev; pick._margin += r.margin; }
      else r._pre = true;
    }
    return r;
  });
  S.bl.forEach(b => {
    const ss = (shipsOf[b.id] || []).filter(s => !s.refused);
    b._ships = ss; b._all = shipsOf[b.id] || [];
    b._posts = [].concat(...ss.map(s => s._posts));
    b._views = sum(ss, s => s._views); b._cost = sum(ss, s => s._cost);
    b._orders = m.orders.filter(o => o._b === b.id && !o._pre);
    b._pre = m.orders.filter(o => o._b === b.id && o._pre);
    b._rev = sum(b._orders, o => o.rev); b._margin = sum(b._orders, o => o.margin); b._res = b._margin - b._cost;
    b._codes = Object.entries(L).filter(([c, l]) => l.b === b.id && l.st !== 'no').map(([c, l]) => ({c, st:l.st}));
    if (!ss.length) b._gr = '';
    else if (b._rev > 0 && b._margin >= b._cost) b._gr = 'A';
    else if (b._posts.length || b._rev > 0) b._gr = 'B';
    else if (ss.some(s => s._st === 'overdue')) b._gr = 'C';
    else b._gr = 'w';
  });
  m.months = [...new Set(S.sh.filter(s => !s.refused && s._sent).map(s => s._sent.slice(0,7)).concat(m.orders.filter(o => o._b).map(o => o.d.slice(0,7))))]
    .filter(x => x >= '2026-06');
  if (m.fotFrom) for (let x = m.fotFrom; x <= TODAY.slice(0,7); x = addDays(x + '-01', 32).slice(0,7)) m.months.push(x);
  m.months = [...new Set(m.months)].sort();
  return m;
}

function parseProfile(u){
  u = String(u || '').trim();
  let m = u.match(/tiktok\.com\/@([A-Za-z0-9_.]+)/i); if (m) return {pl:'TikTok', h:'@' + m[1].replace(/\.$/, ''), url:'https://www.tiktok.com/@' + m[1]};
  m = u.match(/instagram\.com\/([A-Za-z0-9_.]+)/i);
  if (m && !/^(reel|p|stories|explore)$/i.test(m[1])) return {pl:'Instagram', h:'@' + m[1].replace(/\.$/, ''), url:'https://www.instagram.com/' + m[1]};
  m = u.match(/youtube\.com\/@([A-Za-z0-9_.\-]+)/i); if (m) return {pl:'YouTube', h:'@' + m[1], url:'https://www.youtube.com/@' + m[1]};
  m = u.match(/vk\.com\/([A-Za-z0-9_.]+)/i); if (m) return {pl:'VK', h:'@' + m[1], url:'https://vk.com/' + m[1]};
  m = u.match(/t\.me\/([A-Za-z0-9_]+)/i); if (m) return {pl:'Telegram', h:'@' + m[1], url:'https://t.me/' + m[1]};
  if (/^@?[A-Za-z0-9_.]{2,}$/.test(u)) return {pl:'', h:'@' + u.replace(/^@/, ''), url:''};
  return null;
}
function parsePost(u){
  u = String(u || '').trim(); if (!/^https?:\/\//i.test(u)) return null;
  let m = u.match(/tiktok\.com\/@([A-Za-z0-9_.]+)\/video\/\d+/i); if (m) return {pl:'TikTok', fmt:'TikTok видео', h:'@' + m[1]};
  if (/vt\.tiktok\.com|vm\.tiktok\.com/i.test(u)) return {pl:'TikTok', fmt:'TikTok видео', h:''};
  if (/instagram\.com\/reels?\//i.test(u)) return {pl:'Instagram', fmt:'Reels', h:''};
  m = u.match(/instagram\.com\/stories\/([A-Za-z0-9_.]+)/i); if (m) return {pl:'Instagram', fmt:'Stories', h:'@' + m[1]};
  if (/instagram\.com\/p\//i.test(u)) return {pl:'Instagram', fmt:'Пост', h:''};
  if (/youtube\.com\/shorts|youtu\.be/i.test(u)) return {pl:'YouTube', fmt:'YouTube Shorts', h:''};
  return {pl:'', fmt:'', h:''};
}

function toast(t){ const el = $('#toast'); el.innerHTML = t; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 2600); }
async function copyText(t, msg){

  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch(_) {} a.remove(); }
  toast(msg || 'Скопировано');
}
async function pasteInto(inp){
  try { const t = await navigator.clipboard.readText(); if (t){ inp.value = t.trim(); inp.dispatchEvent(new Event('input')); return; } } catch(e) {}
  inp.focus(); toast('Вставьте долгим нажатием в поле');
}

/* ---------- шторки ---------- */
function sheet({title, sub, body, foot, wide, onClose}){
  const w = document.createElement('div'); w.className = 'sw';
  w.innerHTML = `<div class="shx ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="grab"></div>
    <div class="sh-h"><div class="g"><h3>${title}</h3>${sub ? `<div class="s">${sub}</div>` : ''}</div>
    <button class="x" data-close aria-label="Закрыть">${icon('close')}</button></div>
    <div class="sh-b">${body || ''}</div>${foot ? `<div class="sh-f">${foot}</div>` : ''}</div>`;
  $('#sheets').appendChild(w); document.body.classList.add('lock');
  const close = () => { w.remove(); if (!$('#sheets').children.length) document.body.classList.remove('lock'); if (onClose) onClose(); };
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) close(); });
  w._close = close;
  return {el:w, b:$('.sh-b', w), f:$('.sh-f', w), close};
}
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ const all = $$('#sheets .sw'); if (all.length) all[all.length-1]._close(); } });
const closeAll = () => $$('#sheets .sw').forEach(w => w._close());

function tasks(){
  const T = [], done = S.done;
  const add = t => { if (!done[t.id]) T.push(t); };
  // 1. просрочки
  const od = S.sh.filter(s => s._st === 'overdue').sort((a, b) => a._deadline < b._deadline ? -1 : 1);
  if (od.length) add({id:'od', g:'Просрочено', cls:'red', ic:'alert', tt:`${od.length} ${plural(od.length,'посылка','посылки','посылок')} без публикации после дедлайна`,
    tx:`В них лежит <b>${money(sum(od, s => s._cost))}</b> товара и доставки. Напоминание копируется готовым текстом — со ссылкой и промокодом.`,
    list: od.map(s => ({h:`<b>${esc(bh(s.b))}</b><div class="s">${s.id} · дедлайн ${dLong(s._deadline)} · ${money(s._cost)}${M.b[s.b] && M.b[s.b].last && diffDays(M.b[s.b].last, TODAY) > 30 ? ` · <span class="warn">последний пост в профиле — ${dLong(M.b[s.b].last)}</span>` : ''}</div>`,
      a:[['Напомнить', 'remind', s.id, 'pri'], ['Вышла', 'addPostFor', s.id], ['Отказ', 'refuse', s.id]]}))});
  // 2. договорились, но не отправили
  S.sh.filter(s => s._st === 'agreed' && s.b && !s._sentOk && s.sent == null && s.deal && diffDays(s.deal, TODAY) >= 3).forEach(s => add({id:'ag-' + s.id, g:'Отправить', cls:'amb', ic:'truck',
    tt:`${esc(bh(s.b))} — договорились ${dLong(s.deal)}, не отправлено`, tx:`${s.id}. Если посылка уже ушла — укажите трек, даты и стоимость подтянутся сами.`,
    acts:[['Указать трек', 'track', s.id, 'pri'], ['Отказ', 'refuse', s.id]]}));
  S.sh.filter(s => s._sentOk && s.svc && s.svc !== 'СДЭК' && !s.ship && !s.refused).forEach(s => add({id:'nc-' + s.id, g:'Отправить', cls:'amb', ic:'truck',
    tt:`${esc(bh(s.b))} — не СДЭК и нет стоимости доставки`, tx:`${s.id} · ${esc(s.svc)}. Без стоимости доставки расходы отдела занижены.`, acts:[['Внести стоимость', 'track', s.id, 'pri']]}));
  // 3. промокоды из заказов
  Object.entries(M.links).filter(([c, l]) => l.st === 'pending').forEach(([c, l]) => {
    const os = M.orders.filter(o => o.promo === c); const b = M.b[l.b];
    add({id:'pl-' + c, g:'Подтвердить', cls:'blu', ic:'tag', tt:`Промокод ${esc(c)} — это ${esc(b.h)}?`,
      tx:`В архиве заказов <b>${os.length} ${plural(os.length,'заказ','заказа','заказов')} на ${money(sum(os, o => o.rev))}</b> с этим кодом. Код ${l.how}, поэтому спрашиваю.`,
      acts:[['Да, это он', 'linkYes', c, 'pri'], ['Нет', 'linkNo', c]]});
  });
  const free = Object.entries(M.links).filter(([c, l]) => l.st === 'none');
  if (free.length) add({id:'free', g:'Подтвердить', cls:'blu', ic:'tag', tt:`${free.length} ${plural(free.length,'промокод','промокода','промокодов')} в заказах без владельца`,
    tx:`Покупатели вводят эти коды, но в базе бартера они никому не принадлежат. Если это блогеры из бартера — привяжите, и их продажи попадут в итоги.`,
    list: free.map(([c]) => { const os = M.orders.filter(o => o.promo === c);
      return {h:`<b>${esc(c)}</b><div class="s">${os.length} ${plural(os.length,'заказ','заказа','заказов')} · ${money(sum(os, o => o.rev))} · с ${dRu(os.map(o => o.d).sort()[0])}</div>`,
        a:[['Привязать', 'linkPick', c], ['Не бартер', 'linkNo', c]]}; })});
  // 4. нет промокода у блогера с отправкой
  const noCode = S.bl.filter(b => !b.stop && b._ships.length && !promoOf(b));
  if (noCode.length) add({id:'nocode', g:'Промокоды', cls:'amb', ic:'tag', tt:`У ${noCode.length} ${plural(noCode.length,'блогера','блогеров','блогеров')} с отправкой нет промокода`,
    tx:`Без кода продажи не привяжутся. Коды предложены по нику — Матвей создаёт их в Тильде (Настройки сайта → Промокоды, скидка 5 %) и отмечает здесь.`,
    list: noCode.map(b => ({h:`${plb(b.pl)} <b>${esc(b.h)}</b><div class="s">предлагаю <b>${suggestCode(b.h)}</b></div>`, a:[['Создан в Тильде', 'codeMade', b.id, 'ok']]})),
    acts:[['Скопировать список для Тильды', 'copyCodes', '', '']]});
  const notMade = S.bl.filter(b => b.promo && !b.promoOk);
  notMade.forEach(b => add({id:'nm-' + b.id, g:'Промокоды', cls:'amb', ic:'tag', tt:`Промокод ${esc(b.promo)} ещё не создан в Тильде`,
    tx:`${esc(b.h)}: пока кода нет в Тильде, покупатель введёт его и получит ошибку.`, acts:[['Создан в Тильде', 'codeMade', b.id, 'ok']]}));
  S.bl.filter(b => b.promo && /[А-Яа-яЁё]/.test(b.promo)).forEach(b => add({id:'cyr-' + b.id, g:'Промокоды', cls:'amb', ic:'tag',
    tt:`Промокод ${esc(b.promo)} набран кириллицей`, tx:`${esc(b.h)}: с английской раскладки его не ввести. Замените в Тильде на <b>${suggestCode(b.h)}</b>.`,
    acts:[['Заменить на ' + suggestCode(b.h), 'codeFix', b.id, 'pri']]}));
  // 5. вопросы после переноса из таблицы
  const seen = {};
  S.bl.forEach(b => { const k = core(b.h); if (seen[k] && !done['dup-' + k]) add({id:'dup-' + k, g:'После переноса', cls:'amb', ic:'merge',
    tt:`${esc(b.h)} заведён дважды: ${seen[k].id} и ${b.id}`, tx:`Одна ссылка на профиль. Отправки и публикации соберутся в одной карточке, свежие подписчики — ${fmt(Math.max(b.fol, seen[k].fol))}.`,
    acts:[[`Объединить в ${seen[k].id}`, 'merge', seen[k].id + '|' + b.id, 'pri']]}); else seen[k] = b; });
  S.sh.filter(s => !s.b && !s.refused).forEach(s => {
    // подсказка: первый контакт в день договорённости; блогер без отправок — в приоритете
    const same = S.bl.filter(b => b.first && b.first === s.deal);
    const best = same.find(b => !(M.shipsOf[b.id] || []).length) || same[0] || null;
    add({id:'nob-' + s.id, g:'После переноса', cls:'amb', ic:'user', tt:`${s.id} — отправка без блогера`,
      tx:`${s.deal ? 'Договорились ' + dLong(s.deal) + '. ' : ''}${best ? `Похоже на <b>${esc(best.h)}</b>: первый контакт в тот же день.` : 'Выберите, кому ушла посылка.'}`,
      acts:(best ? [[`Это ${best.h}`, 'setB', s.id + '|' + best.id, 'pri']] : []).concat([['Выбрать блогера', 'pickB', s.id], ['Не отправлялась', 'refuse', s.id]])});
  });
  // даты отправки: опечатка в годе и отправка раньше договорённости — одной карточкой
  const dl = [];
  S.sh.filter(s => s.sent && s.sent < '2026-01-01' && !s.refused).forEach(s => {
    const fix = '2026' + s.sent.slice(4);
    dl.push({id:'yr-' + s.id, h:`<b>${s.id} · ${esc(bh(s.b))}</b><div class="s">${dRu(s.sent)} — опечатка в годе, посылка не попадает ни в один месяц</div>`,
      a:[[`Это ${dRu(fix)}`, 'setSent', s.id + '|' + fix, 'pri'], ['Другая', 'pickSent', s.id]]});
  });
  S.sh.filter(s => s._sentOk && !s.refused).forEach(s => {
    const b = M.b[s.b], ref = [s.deal, b && b.first].filter(Boolean).sort().pop();
    if (!ref || s.sent >= ref) return;
    const t = new Date(s.sent + 'T00:00:00Z'); t.setUTCMonth(t.getUTCMonth() + 1); const nx = t.toISOString().slice(0,10);
    const good = nx >= ref && nx <= TODAY;
    dl.push({id:'bf-' + s.id, h:`<b>${s.id} · ${esc(bh(s.b))}</b><div class="s">отправка ${dRu(s.sent)}, а ${s.deal ? 'договорились' : 'первый контакт'} ${dRu(ref)}${good ? ' — похоже, месяц перепутан' : ''}</div>`,
      a:(good ? [[`Это ${dRu(nx)}`, 'setSent', s.id + '|' + nx, 'pri']] : []).concat([['Другая', 'pickSent', s.id], ['Верно', 'dismiss', 'bf-' + s.id]])});
  });
  const dlv = dl.filter(x => !done[x.id]);
  if (dlv.length) T.push({id:'dates', g:'После переноса', cls:'amb', ic:'cal', tt:`${dlv.length} ${plural(dlv.length,'вопрос','вопроса','вопросов')} по датам отправки`,
    tx:'Так в таблице не бывает: год 2009 или отправка раньше договорённости. Подсказка в каждой строке — это вероятная правильная дата; проверьте по чекам или переписке.', list:dlv});
  const byUrl = {};
  S.po.forEach(p => { if (!p.url) return; if (byUrl[p.url]){ const a = byUrl[p.url], keep = a._measured ? a : p._measured ? p : a, drop = keep === a ? p : a;
    add({id:'dp-' + drop.id, g:'После переноса', cls:'amb', ic:'merge', tt:`Одна публикация записана дважды: ${a.id} и ${p.id}`,
      tx:`${esc(bh(p.b))}, ссылка совпадает символ в символ. Оставляю ${keep.id}${keep._measured ? ' — по нему есть замер' : ''}.`, acts:[[`Оставить ${keep.id}`, 'dropPost', drop.id, 'pri']]}); }
    else byUrl[p.url] = p; });
  // 6. находки парсера (лист «Находки» базы)
  const have = new Set(S.po.map(p => p.url));
  const fl = S.found.filter(f => f.st === 'новая' && !have.has(f.url));
  if (fl.length) add({id:'found', g:'Парсер', cls:'grn', ic:'bot', tt:`Парсер нашёл ${fl.length} ${plural(fl.length,'публикацию','публикации','публикаций')}, которых нет в базе`,
    tx:`Ролики и посты с отметкой бренда у блогеров, чья отправка ждёт публикации. Подтвердите — публикация встанет к отправке, просмотры пойдут в итоги.`,
    list: fl.map(f => { const b = findByHandle(f.h), s = b && b._ships.filter(x => !x.refused).sort((a, c) => (c._sent || '') < (a._sent || '') ? -1 : 1)[0];
      return {h:`${plb(f.pl)} <b>${esc(f.h)}</b> · ${esc(f.fmt)} · ${dRu(f.d)}${f.views ? ' · <b>' + fmt(f.views) + '</b> просм.' : ' · ' + fmt(f.likes) + ' лайков'}<div class="s">«${esc(String(f.text || '').slice(0, 90))}»</div>`,
        a:(s ? [[`Это ${s.id}`, 'foundYes', f.n + '|' + s.id, 'pri']] : [['Выбрать отправку', 'foundPick', f.n, 'pri']]).concat([['Открыть', 'openUrl', f.url], ['Не наше', 'foundNo', f.n]])}; })});
  S.found.filter(f => f.code && f.st !== 'отклонена').forEach(f => {
    const b = findByHandle(f.h), code = String(f.code).toUpperCase(), l = M.links[code];
    if (!b || promoOf(b) === code || (l && l.b === b.id)) return;
    add({id:'pc-' + code, g:'Парсер', cls:'red', ic:'tag', tt:`${esc(f.h)} называет в ролике промокод ${esc(code)} — его нет в базе`,
      tx:`Ролик от ${dLong(f.d)}, ${fmt(f.views || 0)} просмотров. Если такого кода нет и в Тильде, покупатели получают ошибку — проверьте срочно.${ORDERS.some(o => o.promo === code) ? '' : ' В заказах этот код пока не встречался.'}`,
      acts:[[`Записать ${code} блогеру`, 'codeFromPost', b.id + '|' + code, 'pri']]});
  });
  S.bl.filter(b => b.missing && !b.stop).forEach(b => add({id:'miss-' + b.id, g:'Парсер', cls:'amb', ic:'alert', tt:`Профиль ${esc(b.h)} не найден`,
    tx:`${esc(b.pl)} отвечает, что такого аккаунта нет — ссылка неверная или блогер сменил ник. Пока ссылка не исправлена, парсер не увидит его публикации.`,
    acts:[['Открыть карточку', 'openBlogger', b.id, 'pri']]}));
  return T;
}

    ${t.acts && t.acts.length ? `<div class="row">${t.acts.map(btn).join('')}</div>` : ''}</div></div>`;

/* ---------- журнал ---------- */
function history(){
  const L = S.log.map(x => ({id:x.id, ts:x.ts, who:x.who, type:x.type === 'history' ? 'm' : x.type === 'system' ? 'a' : x.type, text:x.text,
    ref:x.ref ? String(x.ref).split('|') : null, undo:x.undo, mine:x.who === ME && !!x.undo}));
  M.orders.filter(o => o._b).forEach(o => L.push({ts:o.dt, who:'Заказы', type:'o', text:`заказ с промокодом <b>${esc(o.promo)}</b> · ${money(o.rev)} · ${esc(bh(o._b))}`, ref:['b', o._b], sub:esc(o.items)}));
  L.forEach(x => x.k = String(x.ts || '').length > 10 ? x.ts : (x.ts || '') + ' 00:00');
  return L.sort((a, b) => a.k < b.k ? 1 : a.k > b.k ? -1 : 0);
}
function logItems(n, filter){
  let L = history();
  if (filter && filter !== 'all') L = L.filter(x => filter === 'o' ? x.type === 'o' : filter === 'a' ? (x.type === 'o' || x.type === 'a') : x.who === filter);
  if (n) L = L.slice(0, n);
  if (!L.length) return '<div class="empty">Пока пусто</div>';
  let out = '', lastDay = '';
  const now = mskNow();
  L.forEach((x, i) => {
    const day = x.k.slice(0,10);
    if (day !== lastDay){ lastDay = day; out += `<div class="day">${day === TODAY ? 'Сегодня' : day === addDays(TODAY, -1) ? 'Вчера' : dLong(day)}</div>`; }

    const canSave = () => { $('#saveShip', sh.f).disabled = !(b && !b.stop && st.items.length && (!st.sentNow || deliveryValid(st))); };
    canSave();
    // обработчики
    const bq = $('#bq', sh.b);
    if (bq){ bq.addEventListener('input', () => { st.q = bq.value; drawRes(); }); drawRes(); }
    const chB = $('#chB', sh.b); if (chB) chB.onclick = () => { st.b = null; draw(); setTimeout(() => { const i = $('#bq', sh.b); if (i) i.focus(); }, 30); };
    $('#pick', sh.b).onclick = () => { st.pick = !st.pick; draw(); };
    const pq = $('#pq', sh.b); if (pq) pq.addEventListener('input', () => { st.pq = pq.value; const pos = pq.selectionStart; draw(); const n = $('#pq', sh.b); n.focus(); n.setSelectionRange(pos, pos); });
    $$('[data-pp]', sh.b).forEach(el => el.onclick = () => { const id = el.dataset.pp, ex = st.items.find(i => i.pid === id);
      if (ex) ex.q++; else st.items.push({pid:id, q:1, size:''}); st.pick = false; draw(); });
    $$('[data-sz]', sh.b).forEach(el => el.onclick = () => { const [k, z] = el.dataset.sz.split('|'); st.items[k].size = z; draw(); });
    $$('[data-qm]', sh.b).forEach(el => el.onclick = () => { const i = st.items[el.dataset.qm]; if (i.q > 1) i.q--; draw(); });
    $$('[data-qp]', sh.b).forEach(el => el.onclick = () => { st.items[el.dataset.qp].q++; draw(); });
    $$('[data-rm]', sh.b).forEach(el => el.onclick = () => { st.items.splice(+el.dataset.rm, 1); draw(); });
    $$('[data-pf]', sh.b).forEach(el => {
      let t; el.onpointerdown = () => { t = setTimeout(() => { st.promised = st.promised.filter(y => y.f !== el.dataset.pf); t = 'long'; draw(); }, 550); };
      el.onpointerup = el.onpointerleave = () => { if (t !== 'long') clearTimeout(t); };
      el.onclick = () => { if (t === 'long'){ t = null; return; } const x = st.promised.find(y => y.f === el.dataset.pf); if (x) x.n = x.n >= 5 ? 1 : x.n + 1; else st.promised.push({f:el.dataset.pf, n:1}); draw(); };
    });
    $('#tgSent', sh.b).onclick = () => { st.sentNow = !st.sentNow; draw(); };
    bindDelivery(sh.b, st, draw, canSave);
  };
  const drawRes = () => {
    const box = $('#bres', sh.b); if (!box) return;
    const q = (st.q || '').trim();
    if (!q){ const rec = S.bl.filter(b => !b.stop).slice().sort((a, b) => (b.first || '') < (a.first || '') ? -1 : 1).slice(0, 4);
      box.innerHTML = `<div class="dim" style="font-size:12.5px;margin-top:8px">Недавние</div>` + rec.map(resB).join(''); bindRes(); return; }
    const pr = parseProfile(q);
    const qq = core(q.replace(/^https?:\/\/[^@]*@?/i, ''));
    let hits = [];
    if (pr && pr.url){ const ex = findByHandle(pr.h); hits = ex ? [ex] : []; }
    else hits = S.bl.filter(b => core(b.h).includes(core(q)) || core(b.raw).includes(core(q))).slice(0, 6);
    if (hits.length){ box.innerHTML = hits.map(resB).join(''); bindRes(); return; }
    box.innerHTML = `<div class="box warn" style="margin-top:8px"><div class="t">${icon('alert')} Такого блогера нет в базе</div>
      <div class="d">Сначала добавьте блогера — это одна ссылка на профиль. После сохранения вернётесь сюда, он будет уже выбран.</div>
      <div class="row"><button class="btn sm pri" id="addB">${icon('plus')}Добавить ${pr && pr.h ? esc(pr.h) : 'блогера'}</button></div></div>`;
    $('#addB', box).onclick = () => bloggerForm(pr && pr.url ? pr.url : (pr ? pr.h : q), id => { st.b = id; st.q = ''; draw(); });
    void qq;
  };
  const resB = b => `<div class="res" tabindex="0" data-pb="${b.id}">${plb(b.pl)}<div class="g"><div class="a">${esc(b.h)} ${b.stop ? '<span class="tag" style="color:#ff7b72">стоп-лист</span>' : ''}</div>
    <div class="b">${fmt(b.fol)} подписчиков · ${b._ships.length} ${plural(b._ships.length,'отправка','отправки','отправок')}${promoOf(b) ? ' · ' + esc(promoOf(b)) : ''}</div></div>${grc(b._gr)}</div>`;
  const bindRes = () => $$('[data-pb]', sh.b).forEach(el => el.onclick = () => { st.b = el.dataset.pb; draw(); });
  draw();
  $('#saveShip', sh.f).onclick = async () => {
    const b = M.b[st.b]; if (!b || !st.items.length) return;
    const btn = $('#saveShip', sh.f); btn.classList.add('busy'); btn.textContent = 'Сохраняю…';
    const r = await sendWait({type:'addShip', b:b.id, items:st.items.map(i => ({pid:i.pid, t:(P_BY_ID[i.pid] || {}).t || '', sku:(P_BY_ID[i.pid] || {}).sku || '', size:i.size, q:i.q, cost:pCost(i.pid)})),
      promised:st.promised, sentNow:st.sentNow, svc:st.svc, track:st.track.replace(/\s/g, ''), ship:+st.cost || 0, date:st.date, land:'product', promo:promoOf(b) ? '' : suggestCode(b.h)});
    if (!r.ok){ btn.classList.remove('busy'); btn.textContent = 'Сохранить отправку'; toast('Не сохранилось: ' + esc(r.error || '')); return; }
    sh.close(); await loadAll(); shipDone(r.id);
  };
}

    <div class="row" style="margin:6px 0 10px;font-size:13px"><span class="dim">Сортировка:</span>${[['rev','по выручке'], ['new','новые'], ['fol','по подписчикам']].map(s => `<button class="btn link" data-a="blSort" data-v="${s[0]}" style="${CUR.blSort === s[0] ? 'color:var(--tx);font-weight:600' : ''}">${s[1]}</button>`).join('')}</div>

        <div class="muted" style="font-size:12.5px;display:flex;gap:6px;align-items:center">${plb(b.pl)} ${fmt(b.fol)} · ${esc(promoOf(b) || 'без промокода')}</div></div>

        <span>выручка <b>${b._rev ? money(b._rev) : '—'}</b></span></div></a>`).join('') || '<div class="empty">Никого</div>'}</div>
    <div class="dim" style="font-size:12.5px;margin-top:12px">Оценка: <span class="gr gr-A">A</span> окупился · <span class="gr gr-B">B</span> есть публикация или продажи · <span class="gr gr-C">C</span> дедлайн прошёл, пусто · <span class="gr gr-w">…</span> ждём.</div>`;
  const inp = $('#bq2'); inp.addEventListener('input', () => { CUR.bq = inp.value; const pos = inp.selectionStart; rBloggers(); const n = $('#bq2'); n.focus(); n.setSelectionRange(pos, pos); });

  sheet({title:esc(b.h), sub:`${plb(b.pl)} ${esc(b.pl || '')} · ${fmt(b.fol)} подписчиков · ${b.id}${b.stop ? ' · <span class="bad">стоп-лист</span>' : ''}`, wide:true, body:`

/* ---------- форма: новый блогер ---------- */
function bloggerForm(prefill, onDone){
  const st = {url:prefill || '', src:'', contact:'', code:'', codeTouched:false, made:false};
  const sh = sheet({title:'Новый блогер', sub:'Достаточно ссылки на профиль', body:'', foot:`<button class="btn pri" id="svB" disabled>Сохранить блогера</button>`});
  const draw = () => {
    const pr = parseProfile(st.url);
    const ex = pr ? findByHandle(pr.h) : null;
    if (pr && !st.codeTouched) st.code = suggestCode(pr.h);
    const codeBad = st.code && !/^[A-Z0-9]{3,20}$/.test(st.code);
    const codeTaken = st.code && (S.bl.some(b => b.promo === st.code) || (M.links[st.code] && M.links[st.code].b));
    let prev = '';
    if (st.url && !pr) prev = `<div class="box warn"><div class="d" style="margin:0">Не узнаю ссылку. Подойдёт ссылка на профиль TikTok, Instagram, YouTube, VK или Telegram — или просто ник.</div></div>`;
    else if (ex) prev = `<div class="box bad"><div class="t">${icon('alert')} ${esc(ex.h)} уже есть в базе</div><div class="d">${ex.id} · ${ex._ships.length} ${plural(ex._ships.length,'отправка','отправки','отправок')}. Второй раз заводить не нужно — иначе результаты блогера разъедутся на две карточки.</div>
      <div class="row">${onDone ? `<button class="btn sm pri" id="useEx">Выбрать ${esc(ex.h)}</button>` : ''}<button class="btn sm" data-a="openBlogger" data-v="${ex.id}">Открыть карточку</button></div></div>`;
    else if (pr) prev = `<div class="sel">${pr.pl ? plb(pr.pl) : ''}<div class="g"><b>${esc(pr.h)}</b><div class="muted" style="font-size:12.5px">${pr.pl || 'площадка — уточните ссылкой'} · подписчиков подтянет парсер</div></div>${icon('check')}</div>`;
    sh.b.innerHTML = `
      <div class="fld"><label>Ссылка на профиль</label><div class="inb"><input class="in" id="u" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="tiktok.com/@ник или instagram.com/ник" value="${esc(st.url)}">
        <button class="ib" id="uP" title="Вставить">${icon('paste')}</button></div><div class="hint">Ник, площадку и id система возьмёт из ссылки. Подписчиков и аватар — парсер.</div></div>
      <div style="margin:-6px 0 16px">${prev}</div>
      ${pr && !ex ? `
      <div class="fld"><label>Промокод</label><input class="in" id="code" autocapitalize="characters" value="${esc(st.code)}">
        ${codeBad ? '<div class="hint bad">Только латиница и цифры, 3–20 знаков — кириллицу с английской раскладки не ввести.</div>' : codeTaken ? '<div class="hint bad">Такой код уже занят.</div>' : '<div class="hint">Предложен по нику. Скидка 5 %, как у остальных.</div>'}
        <div class="toggle ${st.made ? 'on' : ''}" id="made" style="margin-top:8px"><div class="g"><b>Уже создан в Тильде</b><div class="dim" style="font-size:12.5px">Если нет — появится задача-напоминание</div></div><div class="sw2"></div></div></div>
      <div class="fld"><label>Как нашли <span class="dim">— по желанию</span></label><div class="chips wrap">${['Сам нашёл','Рекомендация','Написал сам','Биржа'].map(x => `<button class="chip ${st.src === x ? 'on' : ''}" data-src="${x}">${x}</button>`).join('')}</div></div>
      <div class="fld"><label>Контакт <span class="dim">— по желанию</span></label><input class="in" id="ct" placeholder="@ник в Telegram" value="${esc(st.contact)}"></div>` : ''}`;
    $('#svB', sh.f).disabled = !(pr && !ex && !codeBad && !codeTaken);
    const u = $('#u', sh.b); u.addEventListener('input', () => { st.url = u.value; const pos = u.selectionStart; draw(); const n = $('#u', sh.b); n.focus(); try { n.setSelectionRange(pos, pos); } catch(e) {} });
    $('#uP', sh.b).onclick = () => pasteInto(u);
    const useEx = $('#useEx', sh.b); if (useEx) useEx.onclick = () => { sh.close(); onDone(ex.id); };
    const code = $('#code', sh.b); if (code) code.addEventListener('change', () => { st.code = code.value.toUpperCase().trim(); st.codeTouched = true; draw(); });
    const made = $('#made', sh.b); if (made) made.onclick = () => { st.made = !st.made; draw(); };
    $$('[data-src]', sh.b).forEach(el => el.onclick = () => { st.src = st.src === el.dataset.src ? '' : el.dataset.src; draw(); });
    const ct = $('#ct', sh.b); if (ct) ct.oninput = () => st.contact = ct.value;
  };
  draw();
  if (!prefill) setTimeout(() => { const u = $('#u', sh.b); if (u && matchMedia('(min-width: 900px)').matches) u.focus(); }, 60);
  $('#svB', sh.f).onclick = async () => {
    const c = $('#code', sh.b); if (c){ st.code = c.value.toUpperCase().trim(); }
    const pr = parseProfile(st.url); if (!pr || findByHandle(pr.h)) return;
    const btn = $('#svB', sh.f); btn.classList.add('busy'); btn.textContent = 'Сохраняю…';
    const r = await sendWait({type:'addBlogger', h:pr.h, pl:pr.pl || 'Instagram', url:pr.url, promo:st.code, promoOk:st.made, src:st.src.toLowerCase(), contact:st.contact});
    if (!r.ok){ btn.classList.remove('busy'); btn.textContent = 'Сохранить блогера'; toast('Не сохранилось: ' + esc(r.error || '')); return; }
    sh.close(); await loadAll(); toast(`${esc(pr.h)} в базе`);
    if (onDone) onDone(r.id);
  };
}

function stats(period){
  const inP = d => d && (period === 'all' || d.startsWith(period));
  const ss = S.sh.filter(s => !s.refused && s.b && inP(s._sent));
  const direct = sum(ss, s => s._cost);
  const months = period === 'all' ? M.months : [period];
  const fot = sum(months, fotFor);
  const cost = direct + fot;
  const posts = S.po.filter(p => inP(p.d));
  const views = sum(posts, p => p._views);
  const ords = M.orders.filter(o => o._b && !o._pre && inP(o.d));
  const rev = sum(ords, o => o.rev), margin = sum(ords, o => o.margin), disc = sum(ords, o => o.disc);
  const posted = ss.filter(s => s._posts.length);
  const withSales = ss.filter(s => s._orders.length);
  const stuck = ss.filter(s => s._st === 'overdue');
  const days = posted.filter(s => s._days != null && s._days >= 0);
  return {ss, direct, fot, cost, posts, views, ords, rev, margin, disc, posted, withSales, stuck, months,
    res:margin - cost, resDirect:margin - direct, romi:cost ? (margin - cost) / cost : null, cpm:views ? cost / views * 1000 : null,
    media:views / 1000 * S.cfg.cpm, postRate:ss.length ? posted.length / ss.length : null, avgDays:days.length ? sum(days, s => s._days) / days.length : null,
    measured:posts.filter(p => p._measured).length};
}

  const mm = M.months.filter(m => m >= '2026-07');
  const data = mm.map(m => { const s = stats(m); return {m, cost:s.cost, margin:s.margin, direct:s.direct, fot:s.fot, rev:s.rev, n:s.ords.length}; });
  const W = Math.max(280, Math.min(640, $('#chM').clientWidth || 560)), H = 220, pl = 40, pr = 6, pt = 12, pb = 26;
  const mx = Math.max(1, ...data.map(d => Math.max(d.cost, d.margin)));
  const step = mx > 100000 ? 50000 : mx > 40000 ? 20000 : 10000;
  const top = Math.ceil(mx / step) * step;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const bw = 24, gw = (W - pl - pr) / data.length;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v ? (v / 1000) + 'k' : 0}</text>`;
  const bar = (x, v, c) => { const h = Math.max(0, y(0) - y(v)), r = Math.min(4, h); if (h <= 0) return '';
    return `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${c}"/>`; };
  data.forEach((d, i) => {
    const cx = pl + gw * i + gw / 2;
    g += bar(cx - bw - 1, d.cost, 'var(--s2)') + bar(cx + 1, d.margin, 'var(--s1)');
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MON_N[+d.m.slice(5) - 1]}</text>`;
    g += `<rect class="hit" x="${cx - gw / 2}" y="${pt}" width="${gw}" height="${H - pt - pb}" data-tip="${esc(`<b>${MON_N[+d.m.slice(5) - 1]}</b><br>Расходы: ${money(d.cost)}<br>&nbsp;товар и доставка ${money(d.direct)}<br>&nbsp;ФОТ ${money(d.fot)}<br>Маржа с продаж: ${money(d.margin)}<br>Выручка: ${money(d.rev)} · ${d.n} зак.`)}"/>`;
  });
  $('#chM').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Расходы и маржа по месяцам">${g}</svg>`;
  bindTips($('#chM'));
}
function drawFunnel(st){
  const steps = [['Отправлено', st.ss.length], ['Вышла публикация', st.posted.length], ['Принесли заказы', st.withSales.length]];
  const mx = Math.max(1, steps[0][1]);

    <div class="trk"><div class="bar" style="width:${s[1] / mx * 100}%"></div></div></div>`).join('') +
    `<div class="dim" style="font-size:12px">${st.ss.length - st.posted.length} посылок без публикации, из них просрочено ${st.stuck.length}.</div>`;
}
function bindTips(root){
  const tip = $('#tip');
  $$('[data-tip]', root).forEach(el => {
    const show = e => { tip.innerHTML = el.dataset.tip; tip.style.display = 'block';
      const x = (e.touches ? e.touches[0].clientX : e.clientX), yy = (e.touches ? e.touches[0].clientY : e.clientY);
      const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px'; tip.style.top = (yy - tip.offsetHeight - 12) + 'px'; };
    el.addEventListener('mousemove', show); el.addEventListener('mouseleave', () => tip.style.display = 'none');
    el.addEventListener('touchstart', show, {passive:true}); el.addEventListener('touchend', () => setTimeout(() => tip.style.display = 'none', 1800));
  });
}

function pickShip(title, filter, cb){
  const list = S.sh.filter(filter);
  const sh = sheet({title, body: list.length ? list.map(s => `<div class="res" data-s="${s.id}">${M.b[s.b] ? plb(M.b[s.b].pl) : ''}<div class="g"><div class="a">${esc(bh(s.b))} · ${s.id}</div><div class="b">${s.deal ? 'договорились ' + dLong(s.deal) : ''}</div></div></div>`).join('') : '<div class="empty">Все посылки уже с треком</div>'});
  $$('[data-s]', sh.b).forEach(el => el.onclick = () => { sh.close(); cb(el.dataset.s); });
}
function pickBlogger(title, cb){
  const sh = sheet({title, body:`<div class="search">${icon('search')}<input class="in" id="pq" placeholder="Ник" autocomplete="off"></div><div id="pr"></div>`});
  const draw = q => { const l = S.bl.filter(b => !q || core(b.h).includes(core(q))).slice(0, 30);
    $('#pr', sh.b).innerHTML = l.map(b => `<div class="res" data-b="${b.id}">${plb(b.pl)}<div class="g"><div class="a">${esc(b.h)}</div><div class="b">${b.id} · ${b._ships.length} отпр.</div></div></div>`).join('');
    $$('[data-b]', sh.b).forEach(el => el.onclick = () => { sh.close(); cb(el.dataset.b); }); };
  $('#pq', sh.b).oninput = e => draw(e.target.value); draw('');
}
function pickDate(title, cb){
  const sh = sheet({title, body:`<input type="date" class="in" id="d" max="${TODAY}" value="${TODAY}">`, foot:`<button class="btn pri" id="ok">Сохранить</button>`});
  $('#ok', sh.f).onclick = () => { const v = $('#d', sh.b).value; if (v){ sh.close(); cb(v); } };
}

/* =====================================================================
   ДЕЙСТВИЯ (делегирование кликов)
   ===================================================================== */
const A = {
  addMenu, settings, addBlogger:() => bloggerForm(), addPost:() => postForm(),
  openUrl:v => window.open(v, '_blank', 'noopener'),
  foundYes:v => { const [n, sid] = v.split('|'); const f = S.found.find(x => x.n === n), s = M.s[sid], b = M.b[s.b];
    const code = f.code && String(f.code).toUpperCase(), l = code && M.links[code];
    send({type:'addPost', s:sid, url:f.url, fmt:f.fmt, d:f.d, pl:f.pl, src:'парсер', tag:true, code:!!f.code, views:f.views || 0, likes:f.likes, comm:f.comm, foundN:n,
      confirmCode: code && l && l.st === 'pending' && l.b === b.id ? code : ''},
      () => { f.st = 'принята'; S.po.push({id:'…', s:sid, b:b.id, d:f.d, pl:f.pl, fmt:f.fmt, url:f.url, tag:true, code:!!f.code, src:'парсер'}); });
    toast('Публикация добавлена'); },
  foundPick:v => pickShip('К какой отправке?', s => !s.refused && s.b, sid => A.foundYes(v + '|' + sid)),
  foundNo:v => send({type:'foundNo', n:v}, () => { const f = S.found.find(x => x.n === v); if (f) f.st = 'отклонена'; }),
  codeFromPost:v => { const [bid, code] = v.split('|'); send({type:'setPromo', b:bid, code, made:false}, () => { const b = S.bl.find(x => x.id === bid); b.promo = code; b.promoOk = false; }); },
  exp:v => { CUR.exp[v] = !CUR.exp[v]; rToday(); },
  goShips:v => { CUR.shipF = v; location.hash = '#ships'; },
  shipF:v => { CUR.shipF = v; rShips(); }, blF:v => { CUR.blF = v; rBloggers(); }, blSort:v => { CUR.blSort = v; rBloggers(); },
  period:v => { CUR.period = v; rStats(); }, logF:v => { CUR.logF = v; rLog(); },
  openShip, openBlogger, openPost, track:trackForm, measure:measureForm,
  newShipFor:v => { closeAll(); shipForm(v); },
  addPostFor:v => { postForm(v); },
  openRef:v => { const [k, id] = v.split('|'); if (k === 's') openShip(id); else if (k === 'b') openBlogger(id); else if (k === 'p') openPost(id); },
  remind:v => { copyText(remindText(M.s[v]), 'Напоминание скопировано — вставьте в чат с блогером'); send({type:'remind', id:v}); },
  copyUtm:v => copyText(utmFor(M.s[v]), 'Ссылка скопирована'),
  copyBrief:v => copyText(briefText(M.s[v]), 'Сообщение скопировано'),
  copyOne:v => copyText(v),
  delivered:v => { send({type:'delivered', id:v}, () => { M.s[v].dlv = TODAY; }); closeAll(); toast('Отмечено: получено'); },
  refuse:v => { if (!confirm(`${v}: отметить отказ или потерю? Затраты уйдут из расчёта, запись останется в журнале.`)) return;
    send({type:'refuse', id:v}, () => { M.s[v].refused = true; }); closeAll(); },
  linkYes:v => { const l = M.links[v]; send({type:'link', code:v, b:l.b, how:'подтверждено'}, () => { S.links[v] = {b:l.b, st:'ok', how:'подтверждено'}; }); toast('Продажи попали в итоги'); },
  linkNo:v => send({type:'link', code:v, b:''}, () => { S.links[v] = {b:null, st:'no'}; }),
  linkPick:v => pickBlogger(`Чей промокод ${v}?`, id => { send({type:'link', code:v, b:id, how:'привязан вручную'}, () => { S.links[v] = {b:id, st:'ok', how:'привязан вручную'}; }); toast('Продажи попали в итоги'); }),
  codeMade:v => { const b = M.b[v], code = b.promo || suggestCode(b.h);
    send({type:'setPromo', b:v, code, made:true}, () => { b.promo = code; b.promoOk = true; });
    $$('#sheets [data-a="codeMade"][data-v="' + v + '"]').forEach(x => { x.textContent = '✓ Создан'; x.disabled = true; }); },
  codeFix:v => { const b = M.b[v], code = suggestCode(b.h); send({type:'setPromo', b:v, code, made:false}, () => { b.promo = code; b.promoOk = false; }); },
  copyCodes:() => { const l = S.bl.filter(b => !b.stop && b._ships.length && !promoOf(b)).map(b => `${suggestCode(b.h)} — ${b.h}`).join('\n'); copyText(l, 'Список кодов скопирован'); },
  merge:v => { const [keep, drop] = v.split('|'); send({type:'merge', keep, drop}, () => { S.sh.forEach(s => { if (s.b === drop) s.b = keep; }); S.po.forEach(p => { if (p.b === drop) p.b = keep; }); S.bl = S.bl.filter(b => b.id !== drop); }); toast('Объединено'); },
  setB:v => { const [sid, bid] = v.split('|'); send({type:'setB', id:sid, b:bid}, () => { S.sh.find(s => s.id === sid).b = bid; }); },
  pickB:v => pickBlogger(`Кому ушла ${v}?`, id => A.setB(v + '|' + id)),
  setSent:v => { const [sid, d] = v.split('|'); send({type:'setSent', id:sid, date:d}, () => { S.sh.find(s => s.id === sid).sent = d; }); },
  pickSent:v => pickDate(`Дата отправки ${v}`, d => A.setSent(v + '|' + d)),
  dropPost:v => send({type:'dropPost', p:v}, () => { S.po = S.po.filter(p => p.id !== v); }),
  dismiss:v => send({type:'done', task:v, text: /^bf-/.test(v) ? 'подтвердил, что дата отправки ' + v.slice(3) + ' верна' : 'закрыл задачу'}, () => { S.done[v] = 1; }),
  toggleStop:v => { const b = M.b[v]; send({type:'stop', b:v, on:!b.stop}, () => { b.stop = !b.stop; }); closeAll(); },
  undo:v => { send({type:'undo', logId:v}, () => { S.log = S.log.filter(x => x.id !== v); }); toast('Отменяю…'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.v);
});
$('#fab').onclick = addMenu;
$('#gear').onclick = settings;
$('#who').onclick = () => {
  const sh = sheet({title:esc(ME), sub:'Вход на этом устройстве', body:`<div class="menu">
    <div class="mi" data-m="reload"><div class="ic">${icon('log')}</div><div><div class="a">Обновить данные</div><div class="b">база и заказы из архива</div></div></div>
    <div class="mi" data-m="out"><div class="ic">${icon('user')}</div><div><div class="a">Выйти</div><div class="b">забыть PIN на этом устройстве</div></div></div></div>`});
  $$('[data-m]', sh.b).forEach(el => el.onclick = () => { sh.close(); if (el.dataset.m === 'reload'){ loadAll(); loadExt(true); } else logout(''); });
};
// вход: PIN из поля → проверка скриптом → запоминаем на устройстве
async function tryPin(){
  const v = $('#pinIn').value.trim(); if (!v) return;
  const b = $('#pinGo'); b.classList.add('busy'); b.textContent = 'Проверяю…'; $('#pinErr').textContent = '';
  PIN = v;
  const ok = await loadAll();
  b.classList.remove('busy'); b.textContent = 'Войти';
  if (ok){ lsSet(LS.pin, v); loadExt(); flush(); }
}
$('#pinForm').addEventListener('submit', e => { e.preventDefault(); tryPin(); });
window.addEventListener('online', flush);
function boot(){
  const h = (location.hash || '#today').slice(1);
  CUR.page = PAGES.some(p => p.id === h) ? h : 'today';
  // запасной вход по личной ссылке …/barter.html#k=<ключ>
  const mk = location.hash.match(/k=([A-Za-z0-9]+)/); if (mk){ PIN = mk[1]; lsSet(LS.pin, PIN); window.history.replaceState(null, '', location.pathname + '#today'); }
  if (!PIN){ $('#login').hidden = false; setTimeout(() => $('#pinIn').focus(), 50); return; }
  // сначала показываем то, что уже было на этом устройстве, потом обновляем
  try { const c = JSON.parse(lsGet(LS.cache) || 'null'); if (c && c.raw){ ME = c.me; RAW = c.raw; EXT = c.ext; applyExt(); S = fromServer(RAW); SYNC.at = c.at; refresh(); } } catch(e) {}
  renderSync();
  loadAll().then(ok => { if (ok){ loadExt(); flush(); } });
}
boot();
</script>
